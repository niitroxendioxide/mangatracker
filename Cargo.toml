[package]
name = "mangatracker"
version = "0.1.0"
edition = "2024"

[dependencies]
rusqlite = {version = "0.40.1", features = ["bundled"]}
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.7.0", features = ["cors", "fs"] }